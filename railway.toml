[phases.setup]
    nixPkgs = ['nodejs', 'python3']
    aptPkgs = ['build-essential', 'libudev-dev']

[build]
    buildCommand = "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build:backend && find /app -name 'main.js' -not -path '*/node_modules/*' 2>/dev/null || echo 'NO MAIN.JS FOUND'"

[deploy]
    startCommand = "node /app/apps/backend/dist/main.js"
